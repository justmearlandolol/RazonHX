[package]
name = "razon-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "razon_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[[test]]
name = "foundation"
path = "../Tests/RustTests/foundation.rs"
